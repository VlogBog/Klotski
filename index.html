<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Klotski Тренировка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header>
    <h1>Klotski <span>●</span></h1>
    <div class="best" id="best">Рекорд: <b>—</b></div>
  </header>

  <div class="stats">
    <div class="stat idle" id="timeBox"><label for="time">Време</label><output id="time">0:00.0</output></div>
    <div class="stat" id="movesBox"><label for="moves">Ходове</label><output id="moves">0</output></div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board" aria-label="Дъска на пъзела"></div>
  </div>

  <div class="controls">
    <button id="undo" type="button" disabled>↶ Назад <kbd>Z</kbd></button>
    <button id="reset" type="button" class="primary">↻ Отначало <kbd>R</kbd></button>
  </div>

  <div class="recent" id="recent"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="winTitle">
    <h2 id="winTitle">Блокът излезе!</h2>
    <div class="result">
      <div><small>Време</small><strong id="wTime">0:00.0</strong></div>
      <div><small>Ходове</small><strong id="wMoves">0</strong></div>
    </div>
    <span class="badge" id="wBadge" hidden></span>
    <button id="again" type="button" class="primary">Играй пак <kbd>R</kbd></button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
